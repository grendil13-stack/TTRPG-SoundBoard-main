<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Reset your Skald Sound Board password." />
  <title>Reset Password — Skald</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <script>
    (function () {
      var host = window.location.hostname;
      var isAppHost = host === "app.skaldsoundboard.com";
      var isLocal = host === "localhost" || host === "127.0.0.1";
      if (!isAppHost && !isLocal) {
        window.location.replace("https://www.skaldsoundboard.com/");
      }
    })();
  </script>
  <style>
    :root {
      --bg: #0f0f12;
      --bg-elevated: #141418;
      --panel: #18181d;
      --panel-2: #1e1e24;
      --text: #f2f2f5;
      --muted: #9b9ba8;
      --accent: #7f77dd;
      --border: rgba(255, 255, 255, 0.08);
      --font-ui: system-ui, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.35;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px))
        max(24px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
    }

    .reset-panel {
      background: var(--panel);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      max-width: 400px;
      width: 100%;
      padding: 18px 20px 20px;
    }

    .reset-panel h1 {
      margin: 0 0 10px;
      font-size: 1.15rem;
      font-weight: 600;
    }

    .reset-panel .auth-field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    .reset-panel label {
      font-size: 11px;
      color: var(--muted);
    }

    .reset-panel input[type="password"] {
      padding: 8px 10px;
      border-radius: 6px;
      border: 0.5px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-size: 13px;
    }

    .auth-modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    button {
      background: var(--panel-2);
      border: 0.5px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
    }

    button:hover {
      background: #25252c;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .auth-modal-error {
      color: #e87878;
      font-size: 12px;
      margin: 0 0 8px;
      min-height: 1.2em;
    }

    .reset-status {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      margin: 0 0 12px;
    }

    .reset-success a,
    .reset-open-app {
      display: inline-block;
      margin-top: 8px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .reset-success a:hover,
    .reset-open-app:hover {
      text-decoration: underline;
    }

    .reset-success {
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="reset-panel" aria-labelledby="reset-title">
    <h1 id="reset-title">Reset password</h1>
    <p id="reset-status" class="reset-status">Checking your reset link…</p>
    <p id="reset-error" class="auth-modal-error" aria-live="polite"></p>

    <form id="reset-form" hidden>
      <div class="auth-field">
        <label for="reset-password">New password</label>
        <input id="reset-password" type="password" autocomplete="new-password" required />
      </div>
      <div class="auth-field">
        <label for="reset-password-confirm">Confirm password</label>
        <input id="reset-password-confirm" type="password" autocomplete="new-password" required />
      </div>
      <div class="auth-modal-actions">
        <button type="submit" id="reset-submit">Update password</button>
      </div>
    </form>

    <div id="reset-success" class="reset-success" hidden>
      <p>Your password has been updated.</p>
      <a class="reset-open-app" href="https://app.skaldsoundboard.com/">Open Skald</a>
    </div>
  </main>

  <script type="module">
    import { supabase } from "/supabase.js";

    const statusEl = document.getElementById("reset-status");
    const errorEl = document.getElementById("reset-error");
    const formEl = document.getElementById("reset-form");
    const successEl = document.getElementById("reset-success");
    const passwordInput = document.getElementById("reset-password");
    const confirmInput = document.getElementById("reset-password-confirm");
    const submitBtn = document.getElementById("reset-submit");

    function setError(message) {
      if (errorEl) {
        errorEl.textContent = message || "";
      }
    }

    async function initResetPage() {
      const { data: { session }, error } = await supabase.auth.getSession();
      if (error) {
        statusEl.textContent = "This reset link is invalid or has expired.";
        setError(error.message);
        return;
      }
      if (!session?.user) {
        statusEl.textContent =
          "This reset link is invalid or has expired. Request a new one from the sign-in screen.";
        return;
      }

      statusEl.textContent = "Choose a new password for your account.";
      formEl.hidden = false;
    }

    formEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      setError("");

      const password = (passwordInput.value || "").trim();
      const confirm = (confirmInput.value || "").trim();

      if (!password || !confirm) {
        setError("Enter and confirm your new password.");
        return;
      }
      if (password !== confirm) {
        setError("Passwords do not match.");
        return;
      }

      submitBtn.disabled = true;
      const { error } = await supabase.auth.updateUser({ password });
      submitBtn.disabled = false;

      if (error) {
        setError(error.message);
        return;
      }

      formEl.hidden = true;
      statusEl.hidden = true;
      successEl.hidden = false;
    });

    void initResetPage();
  </script>
</body>
</html>
